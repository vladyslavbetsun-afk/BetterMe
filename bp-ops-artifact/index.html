function analyze(issue){

    text: clean(c.body), link: /https?:\/\//.test(c.body), mentions: [...c.body.matchAll(/data-type="mention"[^>]*>@([^<]+)</g)].map(m => m[1].trim())
  })).sort((a, b) => a.at - b.at);

    created: parseT(f.created), updated: parseT(f.updated), actions: [], warnings: [], trigger: null, stage: status, waitingOn: null, since: null,
    wc: wordCount(summary), type: /,\s*update\b/i.test(summary) ? "update" : "new" };
  // images, doc and live link (BP Publishing Batches rules) use every comment, including Oksana's and Yuliia's

  for (const c of allC.sort((a, b) => a.at - b.at)) for (const u of urlsIn(c.body)) {
    if (DOC_RE.test(u)) { T.doc = u; continue; }

      if (anyExp.length) {
        T.actions.push({ kind: "note", label: `Post note tagging ${wName}`, steps: ["Post the note below on the ticket"], comment: writer ? `@${writer.name} Hi. Please address the comments. Thanks.` : null, disabled: !writer });
        if (!writer) T.warnings.push("No Author on ticket");
        T.trigger = lastAny; T.stage = "Note to writer missing"; T.manualOnly = true;
      } else { T.stage = "Check manually"; T.waitingOn = "you"; T.since = (last(cs) || {}).at || T.created; }

    } else {

function flowStats(){

  const clear = f.rate > 0 ? fmtDate(addBiz(f.ready.length / f.rate)) : "—";
  const hist = { "0–1": 0, "2–3": 0, "4–5": 0, "6–10": 0, ">10": 0 };
  f.ages.forEach(a => { hist[a < 2 ? "0–1" : a < 4 ? "2–3" : a < 6 ? "4–5" : a <= 10 ? "6–10" : ">10"]++; });
  if (S.ui.rate == null && f.rate) S.ui.rate = Math.max(1, Math.round(f.rate));
  const rows = [...f.ready].sort((a, b) => (b.readyAge || 0) - (a.readyAge || 0)).map(t => `<tr><td>${keyLink(t)}</td><td>${esc(t.title)}</td><td>${t.type}</td>
    <td class="n">${t.readyAge == null ? "…" : Math.floor(t.readyAge)}</td><td>${t.images.length ? '<span class="tag good">images</span>' : '<span class="tag bad">none</span>'}</td>
    <td>${batchOf(t.key) ? "Batch " + batchOf(t.key).n : ""}</td></tr>`).join("");
  return `<h1>Publishing capacity &amp; flow</h1>
  <p class="lede">Tickets and stages only; nothing here measures a named person. Throughput is counted from Jira day by day for the last ${FLOW_DAYS} business days.</p>
  <div class="kpis">
    <div class="kpi hot"><div class="l">Ready backlog</div><div class="v">${f.ready.length}</div><div class="sub">${f.withImg} with images · ${f.ready.length - f.withImg} without</div></div>
    <div class="kpi"><div class="l">Published per day (10-day ${f.med ? "median" : "average"})</div><div class="v">${S.flow.busy && !f.rate ? "…" : f.rate.toFixed(1)}</div><div class="sub">median ${f.med} · average ${f.mean.toFixed(1)}</div></div>
    <div class="kpi"><div class="l">Backlog clears at this rate</div><div class="v">${clear}</div><div class="sub">${f.rate > 0 ? Math.ceil(f.ready.length / f.rate) + " business days" : "no publishing in the last 10 days"}</div></div>
    <div class="kpi"><div class="l">Net flow this week</div><div class="v">${(f.inW - f.outW >= 0 ? "+" : "") + (f.inW - f.outW)}</div><div class="sub">${f.inW} into Ready · ${f.outW} published</div></div>

  <div class="grid2" style="margin-top:14px">
    <div class="panel"><h3>Into Ready vs published, by business day</h3>${ioChart(f)}</div>
    <div class="panel"><h3>How long Ready tickets have waited</h3>${histChart(hist)}<p class="sub">p50 ${fmtN(pct(f.ages, .5))} · p90 ${fmtN(pct(f.ages, .9))} · oldest ${fmtN(f.ages.length ? Math.max(...f.ages) : null)} business days</p></div>

    <div class="whatif">

      <label for="wIn">Extra inflow per day: <strong id="wInV"></strong><input id="wIn" type="range" min="0" max="10" step="1" value="${S.ui.inflow}"></label>

      <div class="kpi"><div class="l">Backlog in 4 weeks</div><div class="v" id="w4">—</div></div>
    </div>
    <p class="sentence" id="wSentence"></p>
    <div class="row" style="margin-top:8px"><button class="sm" data-act="copy-flow">Copy summary for Slack</button></div>
  </div>
  <h2>Ready queue (${f.ready.length})</h2>
  <div class="tw"><table><thead><tr><th>Key</th><th>Title</th><th>Type</th><th class="n">Days in Ready</th><th>Images</th><th>Batch</th></tr></thead><tbody>${rows || `<tr><td colspan="6" class="empty">Nothing in Ready.</td></tr>`}</tbody></table></div>`;
}
const fmtN = n => n == null ? "—" : (Math.round(n * 10) / 10).toString();
function ioChart(f){
  const W = 560, H = 190, pl = 26, pb = 34, pt = 10, n = f.days.length;
  if (!n) return `<p class="empty">Counting…</p>`;
  const max = Math.max(2, ...f.inflow.map(x => x || 0), ...f.outflow.map(x => x || 0));
  const bw = (W - pl - 8) / n, y = v => pt + (H - pt - pb) * (1 - v / max);
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Tickets into Ready and published per business day">`;
  for (let g = 0; g <= max; g += Math.max(1, Math.ceil(max / 4))) s += `<line x1="${pl}" x2="${W - 4}" y1="${y(g)}" y2="${y(g)}" stroke="var(--line)"/><text x="${pl - 6}" y="${y(g) + 3}" text-anchor="end">${g}</text>`;
  f.days.forEach((d, i) => {
    const x = pl + i * bw + 3, w = (bw - 8) / 2, a = f.inflow[i], b = f.outflow[i];
    if (a != null) s += `<rect x="${x}" y="${y(a)}" width="${w}" height="${y(0) - y(a)}" rx="2" fill="var(--s-ready)"><title>${d}: ${a} into Ready</title></rect>`;
    if (b != null) s += `<rect x="${x + w + 1}" y="${y(b)}" width="${w}" height="${y(0) - y(b)}" rx="2" fill="var(--s-pub)"><title>${d}: ${b} published</title></rect>`;
    if (i % 2 === (n - 1) % 2) s += `<text x="${x + w}" y="${H - pb + 14}" text-anchor="middle">${d.slice(5).replace("-", "/")}</text>`;
  });
  s += `<rect x="${pl}" y="${H - 14}" width="10" height="8" fill="var(--s-ready)"/><text x="${pl + 14}" y="${H - 7}">into Ready</text><rect x="${pl + 90}" y="${H - 14}" width="10" height="8" fill="var(--s-pub)"/><text x="${pl + 104}" y="${H - 7}">published</text></svg>`;
  return s;
}
function histChart(hist){
  const W = 420, H = 170, pb = 24, pt = 14, keys = Object.keys(hist), max = Math.max(1, ...Object.values(hist)), bw = W / keys.length;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Ready tickets by business days waited">`;
  keys.forEach((k, i) => { const v = hist[k], h = (H - pt - pb) * v / max, x = i * bw + 8;
    s += `<rect x="${x}" y="${H - pb - h}" width="${bw - 16}" height="${Math.max(h, 1)}" rx="3" fill="var(--s-ready)"/><text x="${x + (bw - 16) / 2}" y="${H - pb - h - 4}" text-anchor="middle">${v}</text><text x="${x + (bw - 16) / 2}" y="${H - 8}" text-anchor="middle">${k} d</text>`; });
  return s + "</svg>";
}
function updateWhatIf(){
  const f = S._flow; if (!f || !$("wRate")) return;
  const r = +$("wRate").value, inf = +$("wIn").value, net = r - inf, n = f.ready.length;
  S.ui.rate = r; S.ui.inflow = inf;
  $("wRateV").textContent = r; $("wInV").textContent = inf;
  const after = d => Math.max(0, Math.round(n - net * d));
  $("w2").textContent = after(10); $("w4").textContent = after(20);
  $("wClear").textContent = net > 0 ? fmtDate(addBiz(n / net)) : "never";
  const cur = f.rate, clears = x => x - inf > 0 ? "clears on " + fmtDate(addBiz(n / (x - inf))) : "doesn't clear";
  $("wSentence").textContent = `At the current ${cur.toFixed(1)}/day the backlog of ${n} ${clears(cur)}. At ${r}/day it ${clears(r)}.`;
}
function flowSummary(){
  const f = S._flow, n = f.ready.length;
  return [`• Ready backlog: ${n} (${f.withImg} with images)`, `• Publishing throughput: ${f.rate.toFixed(1)}/day (10-day ${f.med ? "median" : "average"})`,
    `• Net flow this week: ${(f.inW - f.outW >= 0 ? "+" : "") + (f.inW - f.outW)}`,
    `• At ${f.rate.toFixed(1)}/day the backlog of ${n} ${f.rate > 0 ? "clears on " + fmtDate(addBiz(n / f.rate)) : "doesn't clear"}.`,
    `• Ready without images: ${n - f.withImg}`].join("\n");
}

    <div class="row">${a.comment ? `<button class="sm" data-act="copy" data-text="${esc(a.comment)}">Copy note</button>` : ""}<a class="btn sm" href="${esc(t.url)}" target="_blank" rel="noopener">Do it in Jira ↗</a></div></div>`;
}

  return `<h1>Review flow</h1>

  <div class="kpis">${counts.map(([l, v, hot]) => `<div class="kpi ${hot ? "hot" : ""}"><div class="l">${l}</div><div class="v">${v}</div></div>`).join("")}</div>

  <div class="row">${[...writers.values()].map(w => `<button class="sm" data-act="draft" data-w="${esc(w.id)}" ${S.canWrite && S.db ? "" : "disabled"}>Draft for ${esc(nameOf(w.id, w.name))}</button>`).join("") || `<span class="empty">No writer needs a nudge.</span>`}</div>

}

  <h2>Batches</h2>${batches || `<p class="empty">No open batches.</p>`}
  <h2>Live link posted, still Ready (${live.length})</h2>
  <div class="list">${live.map(t => `<div class="li">${keyLink(t)}<span class="t">${esc(t.title)}</span><a href="${esc(t.live)}" target="_blank" rel="noopener">live page ↗</a><a class="btn sm" href="${esc(t.url)}" target="_blank" rel="noopener">Move to Published in Jira ↗</a></div>`).join("") || `<span class="empty">none</span>`}</div>`;
}

/* ----- Assign ----- */
function renderAssign(){
  const open = S.allTickets.filter(t => t.status === "Open").sort((a, b) => a.created - b.created);
  const sel = open.find(t => t.key === S.assignKey) || null;
  const load = {}; S.allTickets.forEach(t => { if (t.writer && t.status === "Text") load[t.writer.id] = (load[t.writer.id] || 0) + 1; });
  const cat = sel ? (S.overrides[sel.key] || {}).category || categoryOf(sel.title) : null;
  const ws = WRITERS.map(w => ({ w, fit: fits(w, cat), n: load[w.id] || 0 })).sort((a, b) => (b.fit - a.fit) || (a.n - b.n) || a.w.name.localeCompare(b.w.name));
  const rateLabel = w => w.unit === "article" ? `$${w.rate}${w.rateMax ? "–" + w.rateMax : ""}/article` : `$${w.rate}/word`;
  const rows = ws.map(({ w, fit, n }) => `<tr><td>${esc(w.name)}${fit ? "" : ' <span class="tag warn">outside niche</span>'}${w.noReview ? ' <span class="tag">no expert review</span>' : ""}</td><td>${esc(w.niche)}</td><td class="n">${n}</td>
    ${S.owner ? `<td class="mono">${rateLabel(w)}</td><td class="n">${sel ? (priceFor(w, { wc: sel.wc, cat }) || "—") : ""}</td>` : ""}
    <td>${sel ? `<button class="sm" data-act="assign-copy" data-w="${esc(w.id)}">Assign steps</button>` : ""}</td></tr>`).join("");
  return `<h1>Assign</h1><p class="lede">Pick an Open ticket. Writers whose topic fits come first, then the ones with the fewest tickets in Text.${S.owner ? " Prices are word count × rate (or flat fee) plus the expert estimate: fitness +$50, nutrition +$20–50." : ""}</p>
  <div class="grid2"><div><h2>Open queue (${open.length})</h2><div class="tw"><table><thead><tr><th>Key</th><th>Title</th><th>Topic</th><th class="n">Words</th><th>Age</th></tr></thead><tbody>
  ${open.map(t => `<tr style="${sel && sel.key === t.key ? "background:var(--accent-soft)" : ""}"><td>${keyLink(t)}</td><td><a href="#" data-act="pick" data-k="${esc(t.key)}">${esc(t.title)}</a></td><td><span class="tag">${esc(categoryOf(t.title) || "unclear")}</span>${t.type === "update" ? '<span class="tag">update</span>' : ""}</td><td class="n">${t.wc ? t.wc.min + (t.wc.max !== t.wc.min ? "–" + t.wc.max : "") : '<span class="sub">unpriced</span>'}</td><td class="sub">${ago(t.created)}</td></tr>`).join("") || `<tr><td colspan="5" class="empty">The Open queue is empty.</td></tr>`}</tbody></table></div></div>
  <div><h2>Writers${sel ? " for " + esc(sel.key) : ""}</h2><div class="tw"><table><thead><tr><th>Writer</th><th>Niche</th><th class="n">In Text</th>${S.owner ? "<th>Rate</th><th class=\"n\">Price</th>" : ""}<th></th></tr></thead><tbody>${rows}</tbody></table></div>
  <div id="assignOut" style="margin-top:10px"></div></div></div>`;
}

/* ---------- events ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("nav.tabs button"); if (tab) { S.tab = tab.dataset.tab; lsSet("bpops.tab", S.tab); render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.type === "checkbox") return;
  const act = el.dataset.act;
  if (act === "pick") { e.preventDefault(); S.assignKey = el.dataset.k; render(); return; }
  if (act === "copy") return copy(el.dataset.text, el);
  if (act === "copy-flow") return copy(flowSummary(), el);
  if (act === "allow") { S.err = null; return load(true); }
  if (act === "assign-copy") {
    const w = WRITER_BY[el.dataset.w], t = S.allTickets.find(x => x.key === S.assignKey); if (!w || !t) return;
    const steps = [`Set Author = ${w.name}`, `Add ${w.name} to Request participants`, "Move to Text"];
    $("assignOut").innerHTML = `<div class="todo"><strong>${esc(t.key)} → ${esc(w.name)}</strong><ol style="margin:0;padding-left:20px">${steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol><div class="row"><a class="btn sm" href="${esc(t.url)}" target="_blank" rel="noopener">Do it in Jira ↗</a></div></div>`;
    return;
  }
  if (act === "exclude") { await dbSet("exclusions/" + el.dataset.k, { title: el.dataset.title, at: Date.now() }); return; }
  if (act === "include") { await dbDel("exclusions/" + el.dataset.k); return; }
  if (act === "draft") {
    const D = derive(); const wid = el.dataset.w; const ts = attentionFor(wid, D); if (!ts.length) return toast("Nothing to follow up for this writer");
    const { again, text } = nudgeText(wid, ts); const keys = ts.map(t => t.key).sort(); const day = ymd(new Date());
    const id = "n-" + day + "-" + fnv([wid, keys.join(","), day, again ? "repeat" : "first"].join("|"));
    if (S.nudges[id]) return toast("This exact message was already drafted today");
    const w = WRITER_BY[wid] || {}; if (await dbSet("nudges/" + id, { writerId: wid, writerName: w.name || nameOf(wid), keys, text, template: again ? "repeat" : "first", createdAt: Date.now() })) toast("Draft saved");
    return;
  }
  if (act === "sent") { const n = S.nudges[el.dataset.id]; if (n && !n.sentAt) await dbSet("nudges/" + el.dataset.id, { ...n, sentAt: Date.now() }); return; }
  if (act === "discard") { await dbDel("nudges/" + el.dataset.id); return; }
  if (act === "batch-new" || act === "batch-suggest") {
    let keys = [...S.sel];
    if (act === "batch-suggest") keys = S.tickets.filter(t => t.status === "Ready" && t.images.length && !batchOf(t.key)).sort((a, b) => a.key.localeCompare(b.key)).slice(0, 4).map(t => t.key);
    if (!keys.length) return toast(act === "batch-new" ? "Select at least one ticket" : "No Ready tickets with images outside a batch");
    const n = Math.max(0, ...Object.values(S.batches).map(b => b.n || 0)) + 1;
    if (await dbSet("batches/b" + Date.now(), { n, keys, createdAt: Date.now(), archived: false })) { S.sel.clear(); toast(`Batch ${n} created`); }
    return;
  }
  if (act === "batch-sent") { const b = S.batches[el.dataset.id]; if (b && !b.sentAt) await dbSet("batches/" + el.dataset.id, { ...b, sentAt: Date.now() }); return; }
  if (act === "batch-archive") { const b = S.batches[el.dataset.id]; if (b) await dbSet("batches/" + el.dataset.id, { ...b, archived: true }); return; }
});
document.addEventListener("change", async e => {
  const el = e.target;
  if (el.id === "scope") { S.scope = el.value; lsSet("bpops.scope", S.scope); reanalyze(); render(); return; }
  if (el.dataset.act === "sel") { el.checked ? S.sel.add(el.dataset.k) : S.sel.delete(el.dataset.k); render(); return; }
  if (el.dataset.act === "ov-cat" || el.dataset.act === "ov-exp") {
    const k = el.dataset.k, cur = { ...(S.overrides[k] || {}) };
    if (el.dataset.act === "ov-cat") cur.category = el.value || null; else cur.expertId = el.value || null;
    if (!cur.category && !cur.expertId && cur.autoSlack == null) await dbDel("overrides/" + k); else await dbSet("overrides/" + k, cur);
  }
});
document.addEventListener("input", e => { if (e.target.id === "wRate" || e.target.id === "wIn") updateWhatIf(); });
$("refresh").addEventListener("click", () => { S.err = null; load(true); });

/* ---------- boot ---------- */
render();
(async () => {
  const [mcp, db, user] = await Promise.all([
    window.claude ? window.claude.use("mcp").catch(() => null) : null,
    window.claude ? window.claude.use("db").catch(() => null) : null,
    window.claude ? window.claude.use("user").catch(() => null) : null
  ]);
  S.mcp = mcp; S.db = db; S.user = user; S.mcpChecked = true;
  S.owner = user ? !!(await Promise.resolve(user.isOwner()).catch(() => false)) : false;
  if (user && user.can) { const w = await Promise.resolve(user.can("data.write")).catch(() => null); if (w === false) S.canWrite = false; }
  if (db) subscribeDb();
  render();
  if (mcp) load(false);
})();
setInterval(() => { if (!document.hidden && S.at) renderHealth(); }, 60000);
</script>
